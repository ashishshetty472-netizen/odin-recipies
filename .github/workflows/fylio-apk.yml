name: Build Fylio APK

# Builds the Android APK on a GitHub runner (this project cannot be assembled in a
# sandbox without a JDK 17 + Android SDK + Google Maven access).
#
# The finished APKs are committed to the `apk-latest` branch so they can be downloaded
# straight from GitHub, and are also attached to the workflow run as artifacts.

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'fylio/**'
      - '.github/workflows/fylio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fylio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform + build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fylio/**/*.gradle.kts', 'fylio/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs
        working-directory: fylio
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find fylio/app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \;
          ls -la out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fylio-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish APKs to apk-latest branch
        if: success()
        run: |
          set -euo pipefail
          cd out
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          {
            echo "# Fylio APK builds"
            echo
            echo "Built automatically from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for f in *.apk; do
              printf '| `%s` | %s | `%s` |\n' "$f" "$(du -h "$f" | cut -f1)" "$(cut -d' ' -f1 "$f.sha256")"
            done
            echo
            echo "Install with: \`adb install -r app-release.apk\`"
          } > README.md
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-latest
          git rm -rf --cached . > /dev/null
          git add -f out/*.apk out/*.sha256 out/README.md
          git commit -m "APK build ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push --force origin apk-latest
