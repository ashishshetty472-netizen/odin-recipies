name: Build Fylio APK

# Builds the Android APK on a GitHub runner (this project cannot be assembled in a
# sandbox without a JDK 17 + Android SDK + Google Maven access).
#
# The finished APKs are committed to the `apk-latest` branch so they can be downloaded
# straight from GitHub, and are also attached to the workflow run as artifacts.
# Build logs are published to the `ci-logs` branch on failure.

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'fylio/**'
      - '.github/workflows/fylio-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fylio-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          set -x
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          if [ -d "$SDK/platforms/android-34" ] && [ -d "$SDK/build-tools/34.0.0" ]; then
            echo "android-34 and build-tools 34.0.0 already present"
          else
            SDKM="$(command -v sdkmanager || true)"
            if [ -z "$SDKM" ]; then
              SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            fi
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('fylio/**/*.gradle.kts', 'fylio/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APKs
        working-directory: fylio
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find fylio/app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \; || true
          ls -la out || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fylio-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Publish APKs to apk-latest branch
        if: success()
        run: |
          set -euo pipefail
          cd out
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          {
            echo "# Fylio APK builds"
            echo
            echo "Built automatically from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for f in *.apk; do
              printf '| `%s` | %s | `%s` |\n' "$f" "$(du -h "$f" | cut -f1)" "$(cut -d' ' -f1 "$f.sha256")"
            done
            echo
            echo "Install with: \`adb install -r app-release.apk\`"
          } > README.md
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-latest
          git rm -rf --cached . > /dev/null
          git add -f out/*.apk out/*.sha256 out/README.md
          git commit -m "APK build ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push --force origin apk-latest

      - name: Publish build log on failure
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p /tmp/logs
          cp "$RUNNER_TEMP/build.log" /tmp/logs/build.log 2>/dev/null || echo "no gradle log produced" > /tmp/logs/build.log
          cd /tmp/logs
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.log
          git commit -qm "build log ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/ci-logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
